<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { width: 260px; padding: 16px; background: #0a0a0a; color: #fff; }
    h1 { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #a78bfa; }
    label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; margin-top: 10px; }
    input {
      width: 100%; padding: 7px 10px; border-radius: 8px;
      background: #111; border: 1px solid #333; color: #fff;
      font-size: 12px; outline: none;
    }
    input:focus { border-color: #7c3aed; }
    button {
      margin-top: 14px; width: 100%; padding: 8px;
      background: #7c3aed; color: #fff; border: none;
      border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    #status { margin-top: 10px; font-size: 11px; color: #666; text-align: center; min-height: 16px; }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }
    p.hint { font-size: 10px; color: #444; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🛍 Wish Me Scraper</h1>

  <label>API URL</label>
  <input id="apiUrl" type="text" placeholder="http://localhost:3000" />

  <label>API Token (optional)</label>
  <input id="apiToken" type="password" placeholder="Leave blank if SCRAPER_TOKEN not set" />

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <p class="hint">Browse any Amazon or Flipkart search page — products are saved automatically.</p>

  <script src="popup.js"></script>
</body>
</html>
