<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { width: 300px; background: #0a0a0a; color: #fff; }

    .header { padding: 14px 16px 12px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 8px; }
    .header-icon { font-size: 16px; }
    .header-title { font-size: 13px; font-weight: 700; color: #a78bfa; }

    /* Current page status */
    .status-bar { padding: 10px 16px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.active { background: #4ade80; box-shadow: 0 0 6px #4ade8088; }
    .status-dot.inactive { background: #333; }
    .status-text { font-size: 11px; color: #888; }
    .status-text span { color: #ccc; font-weight: 600; }

    /* Store pills */
    .stores { padding: 10px 16px; border-bottom: 1px solid #1a1a1a; }
    .stores-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
    .store-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .store-pill { font-size: 10px; padding: 3px 8px; border-radius: 99px; border: 1px solid #222; color: #555; display: flex; align-items: center; gap: 4px; }
    .store-pill.supported { border-color: #7c3aed44; color: #a78bfa; }
    .store-pill.current { border-color: #7c3aed; background: #7c3aed22; color: #c4b5fd; font-weight: 600; }
    .store-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* History */
    .history { padding: 10px 16px; }
    .history-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
    .history-empty { font-size: 11px; color: #333; text-align: center; padding: 12px 0; }
    .scrape-item { padding: 7px 0; border-bottom: 1px solid #111; }
    .scrape-item:last-child { border-bottom: none; }
    .scrape-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .scrape-store { font-size: 10px; font-weight: 700; text-transform: capitalize; }
    .scrape-store.amazon { color: #fb923c; }
    .scrape-store.flipkart { color: #60a5fa; }
    .scrape-store.myntra { color: #f472b6; }
    .scrape-store.nykaa { color: #fb7185; }
    .scrape-store.croma { color: #34d399; }
    .scrape-store.google { color: #4ade80; }
    .scrape-count { font-size: 10px; color: #555; }
    .scrape-time { font-size: 10px; color: #333; }
    .scrape-titles { display: flex; flex-direction: column; gap: 2px; }
    .scrape-title { font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Settings */
    .settings { padding: 10px 16px; border-top: 1px solid #1a1a1a; }
    details summary { font-size: 10px; color: #444; cursor: pointer; text-transform: uppercase; letter-spacing: .08em; user-select: none; }
    details[open] summary { color: #666; margin-bottom: 8px; }
    label { font-size: 11px; color: #666; display: block; margin-bottom: 3px; margin-top: 8px; }
    input { width: 100%; padding: 6px 9px; border-radius: 7px; background: #111; border: 1px solid #222; color: #fff; font-size: 11px; outline: none; }
    input:focus { border-color: #7c3aed; }
    button.save-btn { margin-top: 10px; width: 100%; padding: 7px; background: #7c3aed; color: #fff; border: none; border-radius: 7px; font-size: 11px; font-weight: 600; cursor: pointer; }
    button.save-btn:hover { background: #6d28d9; }
    #status { margin-top: 6px; font-size: 10px; color: #666; text-align: center; min-height: 14px; }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🛍</span>
    <span class="header-title">Wish Me Scraper</span>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Checking page…</div>
  </div>

  <div class="stores">
    <div class="stores-label">Supported stores</div>
    <div class="store-list" id="storeList"></div>
  </div>

  <div class="history">
    <div class="history-label">Recent scrapes</div>
    <div id="historyList"><div class="history-empty">No scrapes yet — browse a search page.</div></div>
  </div>

  <div class="settings">
    <details>
      <summary>⚙ Settings</summary>
      <label>API URL</label>
      <input id="apiUrl" type="text" placeholder="http://localhost:3000" />
      <label>API Token (optional)</label>
      <input id="apiToken" type="password" placeholder="Leave blank if SCRAPER_TOKEN not set" />
      <button class="save-btn" id="save">Save</button>
      <div id="status"></div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
